# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (thêm m?i - l?y t? .env)
app.jwt-secret=${JWT_SECRET}
app.jwt-expiration=604800000

# Google OAuth
app.google-client-id=${GOOGLE_CLIENT_ID:your-google-client-id}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Th? m?c l?u file upload (t??ng ??i v?i th? m?c ch?y app)
app.upload-dir=uploads

# URL g?c c?a backend (dùng ?? t?o public URL cho ?nh)
app.base-url=http://localhost:8080

# Gi?i h?n kích th??c file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB